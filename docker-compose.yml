# Локальный сервер PostgreSQL 16 для разработки (параметры совпадают с appsettings.json).
# Запуск: docker compose up -d
services:
  db:
    image: postgres:16
    container_name: attendance-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
